name: macOS build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run portable project checks
        run: SWEET_NO_SLEEP_SKIP_SWIFT_BUILD=1 ./Scripts/check-project.sh

      - name: Render the media pack with the stock macOS tools
        run: |
          # qlmanage rasterizes the SVG sources and iconutil packs the .icns,
          # so this is the release path for the app icon and preview art. The
          # renderer falls back to another tool per source, and skips with a
          # message when the runner has none.
          LOG_FILE="$(mktemp)"
          STATUS=0
          ./Scripts/render-media.sh >"$LOG_FILE" 2>&1 || STATUS=$?
          cat "$LOG_FILE"
          python3 - "$LOG_FILE" "$STATUS" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          status = int(sys.argv[2])
          def publish(level, title, lines):
              summary = " | ".join(lines or ["no output"])
              summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title={title}::{summary}")
          if status != 0:
              publish("error", "Media render diagnostics", log[-20:])
          else:
              publish("notice", "Media render", [line for line in log if line.strip()][:2] + log[-1:])
          sys.exit(status)
          PY

      - name: Verify the rendered media
        run: |
          LOG_FILE="$(mktemp)"
          STATUS=0
          python3 Scripts/verify-media.py >"$LOG_FILE" 2>&1 || STATUS=$?
          cat "$LOG_FILE"
          python3 - "$LOG_FILE" "$STATUS" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          status = int(sys.argv[2])
          summary = " | ".join(log[-20:] or ["no output"])
          summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          if status != 0:
              print(f"::error title=Media verification diagnostics::{summary}")
          else:
              print(f"::notice title=Media verification::{summary}")
          sys.exit(status)
          PY

      - name: Build Swift package with diagnostics
        run: |
          LOG_FILE="$(mktemp)"
          if swift build --package-path . --configuration debug >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
          else
            cat "$LOG_FILE"
            python3 - "$LOG_FILE" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          lines = log.splitlines()
          diagnostics = [line for line in lines if "error:" in line or "fatal error:" in line]
          if not diagnostics:
              diagnostics = [line for line in lines if "warning:" in line]
          summary = " | ".join(diagnostics[-20:] or lines[-25:]) or "Swift build failed; inspect the step log."
          summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Swift build diagnostics::{summary}")
          PY
            exit 1
          fi

      - name: Run full project check on macOS
        run: ./Scripts/check-project.sh

      - name: Assemble app bundle
        run: ./Scripts/build-app.sh release

      - name: Verify app bundle structure and signature
        run: |
          APP="dist/Sweet No Sleep — Kiwi Cat.app"
          test -x "$APP/Contents/MacOS/SweetNoSleep"
          test -d "$APP/Contents/Resources/PetSkins"
          find "$APP/Contents/Resources" -maxdepth 1 -name '*.bundle' -print -quit | grep -q .
          test -f "$APP/Contents/Resources/SweetNoSleep.icns"
          test -f "$APP/Contents/Resources/Media/menubar-awake.png"
          test -f "$APP/Contents/Resources/Media/menubar-asleep.png"
          test -f "$APP/Contents/Resources/Media/preview-kiwi.png"
          plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist" | grep -qx "SweetNoSleep.icns"
          codesign --verify --deep --strict "$APP"

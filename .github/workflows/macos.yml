name: macOS build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run portable project checks
        run: SWEET_NO_SLEEP_SKIP_SWIFT_BUILD=1 ./Scripts/check-project.sh

      - name: Build Swift package with diagnostics
        run: |
          LOG_FILE="$(mktemp)"
          if swift build --package-path . --configuration debug >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
          else
            cat "$LOG_FILE"
            python3 - "$LOG_FILE" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          lines = log.splitlines()
          diagnostics = [line for line in lines if "error:" in line or "fatal error:" in line]
          if not diagnostics:
              diagnostics = [line for line in lines if "warning:" in line]
          summary = " | ".join(diagnostics[-20:] or lines[-25:]) or "Swift build failed; inspect the step log."
          summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Swift build diagnostics::{summary}")
          PY
            exit 1
          fi

      - name: Run full project check on macOS
        run: ./Scripts/check-project.sh

      - name: Assemble app bundle
        run: ./Scripts/build-app.sh release

      - name: Verify app bundle structure and signature
        run: |
          APP="dist/Sweet No Sleep — Kiwi Cat.app"
          test -x "$APP/Contents/MacOS/SweetNoSleep"
          test -d "$APP/Contents/Resources/PetSkins"
          test -s "$APP/Contents/Resources/SweetNoSleep.icns"
          test -s "$APP/Contents/Resources/Media/menubar-awake.png"
          test -s "$APP/Contents/Resources/Media/menubar-asleep.png"
          test -s "$APP/Contents/Resources/Media/preview-kiwi.png"
          test -s "$APP/Contents/Resources/Media/preview-kot-arbuz.png"
          test -s "$APP/Contents/Resources/PetSkins/kot-arbuz/body.png"
          test -s "$APP/Contents/Resources/PetSkins/kot-arbuz/tail.png"
          test -s "$APP/Contents/Resources/PetSkins/kot-arbuz/pet.json"
          find "$APP/Contents/Resources" -maxdepth 1 -name '*.bundle' -print -quit | grep -q .
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist" | grep -q 'SweetNoSleep.icns'
          codesign --verify --deep --strict "$APP"

      - name: Verify compiled localizations
        run: |
          APP="dist/Sweet No Sleep — Kiwi Cat.app"
          python3 - "$APP/Contents/Resources" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          resources = pathlib.Path(sys.argv[1])
          bundles = sorted(resources.glob("*.bundle"))
          if not bundles:
              sys.exit("No SwiftPM resource bundle in the app")
          expected = {"es": "Ajustes", "ja": "設定", "ko": "설정", "ru": "Настройки", "zh-Hans": "设置"}
          for locale, value in expected.items():
              strings = [path for bundle in bundles for path in bundle.rglob(f"{locale}.lproj/Localizable.strings")]
              if not strings:
                  sys.exit(f"Missing compiled {locale}.lproj/Localizable.strings")
              data = json.loads(subprocess.check_output(["plutil", "-convert", "json", "-o", "-", str(strings[0])]))
              if data.get("Settings") != value:
                  sys.exit(f"{locale}: 'Settings' resolves to {data.get('Settings')!r}, expected {value!r}")
              print(f"{locale}: Settings -> {value}")
          PY

      - name: Commit macOS-rendered media outputs to the task branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/e650720d-sweet-no-sleep'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Resources/Art/Rendered
          if git diff --cached --quiet; then
            echo 'Rendered outputs are already current.'
          else
            git commit -m 'chore: add macOS-rendered media outputs'
            git push origin HEAD:arena/e650720d-sweet-no-sleep
          fi

      - name: Upload generated media kit
        uses: actions/upload-artifact@v4
        with:
          name: sweet-no-sleep-media
          path: Resources/Art/Rendered/
          if-no-files-found: error
          retention-days: 30

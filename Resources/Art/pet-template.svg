<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>My Pet — draw inside the named layers, do not rename them</title>
  <!-- LAYER RULES (also see docs/PET_DRAWING_GUIDE.md):
       - Draw your own shapes INSIDE each group with id="...".
       - Never rename, delete or merge these groups. Extra decorative groups are OK.
       - Keep everything inside the 400x400 canvas. Simple shapes work best. -->
  <g id="tail">
    <path d="M298 250 C 340 240, 350 190, 335 150 C 330 138, 342 132, 348 142 C 366 184, 356 244, 310 258 Z" fill="#E8C894" stroke="#5D443B" stroke-width="6" stroke-linejoin="round"/>
  </g>

  </g>
  <g id="belly-mark">
    <path d="M200 285 c -18 -14 -34 -22 -34 -36 c 0 -10 8 -16 17 -16 c 7 0 13 4 17 10 c 4 -6 10 -10 17 -10 c 9 0 17 6 17 16 c 0 14 -16 22 -34 36 Z" fill="#8BC34A" stroke="#5D443B" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g id="ear-left">

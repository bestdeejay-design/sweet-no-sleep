<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Sweet No Sleep — stay in your flow</title>
  <desc id="description">A calm desktop companion for Mac: focus sessions, gentle breaks, and a little Kiwi cat that keeps your work session awake.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7ED"/>
      <stop offset="1" stop-color="#EAF2E5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#1B293B"/>
      <stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="fur" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#F3D8A7"/>
      <stop offset="1" stop-color="#E8C48A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FD681"/>
      <stop offset="1" stop-color="#5AA46D"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#paper)"/>

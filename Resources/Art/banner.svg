  <rect x="716" y="80" width="306" height="461" rx="34" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.54" stroke-width="2"/>
  <circle cx="751" cy="116" r="5" fill="#E79082"/>
  <circle cx="770" cy="116" r="5" fill="#E5C178"/>
  <circle cx="789" cy="116" r="5" fill="#76C486"/>
  <text x="751" y="160" fill="#F4F1E9" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SWEET NO SLEEP</text>
  <text x="751" y="183" fill="#A5B0BE" font-family="Avenir Next, Arial, sans-serif" font-size="10" font-weight="500">A calm corner for deep work</text>

  <rect x="750" y="205" width="238" height="82" rx="19" fill="#172234" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="766" y="224" width="40" height="40" rx="13" fill="#285039"/>
  <path d="M786 234v19m-7-12 7-7 7 7" fill="none" stroke="#99E2A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="818" y="239" fill="#FFFFFF" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700">Keep Mac awake</text>
  <text x="818" y="258" fill="#AEB9C6" font-family="Avenir Next, Arial, sans-serif" font-size="9" font-weight="500">Idle sleep is prevented</text>
  <rect x="930" y="232" width="46" height="27" rx="14" fill="#72C283"/>
  <circle cx="963" cy="245.5" r="10" fill="#FFFFFF"/>

  <rect x="750" y="301" width="238" height="202" rx="20" fill="#172234" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="770" y="330" fill="#B4DDB9" font-family="Avenir Next, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">FOCUS SESSION</text>
  <text x="770" y="371" fill="#F6F4EE" font-family="Avenir Next, Arial, sans-serif" font-size="23" font-weight="700">50 minutes</text>
  <text x="770" y="394" fill="#AEB9C6" font-family="Avenir Next, Arial, sans-serif" font-size="10" font-weight="500">Normal sleep resumes when done</text>
  <rect x="770" y="417" width="170" height="44" rx="15" fill="#91D18E"/>
  <text x="855" y="445" text-anchor="middle" fill="#17251A" font-family="Avenir Next, Arial, sans-serif" font-size="11" font-weight="700">Start focus session</text>
  <text x="770" y="481" fill="#8694A5" font-family="Avenir Next, Arial, sans-serif" font-size="9" font-weight="500">A soft nudge, never a blocker.</text>


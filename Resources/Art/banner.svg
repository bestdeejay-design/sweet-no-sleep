  <text x="141" y="108" fill="#829080" font-family="Avenir Next, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.65">A TINY MAC DESKTOP COMPANION</text>

  <!-- Main release message -->
  <text x="80" y="237" fill="#26382E" font-family="Avenir Next, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.6">Stay in your</text>
  <text x="80" y="316" fill="#26382E" font-family="Avenir Next, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2.8">flow.</text>
  <path d="M83 343h104" stroke="#75B978" stroke-width="6" stroke-linecap="round"/>
  <text x="82" y="393" fill="#5D685F" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="500">A gentle focus timer for long sessions and AI agents.</text>
  <text x="82" y="425" fill="#5D685F" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="500">Normal sleep resumes when your work is done.</text>


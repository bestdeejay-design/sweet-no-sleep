    <ellipse cx="387" cy="569" rx="46" ry="66" fill="#5C9B73" stroke="#5D443B" stroke-width="13"/>
    <ellipse cx="637" cy="569" rx="46" ry="66" fill="#5C9B73" stroke="#5D443B" stroke-width="13"/>
    <ellipse cx="394" cy="580" rx="19" ry="39" fill="#352B2A"/>
    <ellipse cx="630" cy="580" rx="19" ry="39" fill="#352B2A"/>
    <circle cx="375" cy="548" r="12" fill="#FFFFFF"/>
    <circle cx="618" cy="548" r="12" fill="#FFFFFF"/>

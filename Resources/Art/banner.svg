  <text x="818" y="258" fill="#AEB9C6" font-family="Avenir Next, Arial, sans-serif" font-size="9" font-weight="500">Idle sleep is prevented</text>
  <rect x="930" y="232" width="46" height="27" rx="14" fill="#72C283"/>
  <circle cx="963" cy="245.5" r="10" fill="#FFFFFF"/>

  <rect x="750" y="301" width="238" height="202" rx="20" fill="#172234" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="770" y="330" fill="#B4DDB9" font-family="Avenir Next, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">FOCUS SESSION</text>
